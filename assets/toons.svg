<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Little cartoon characters: AI robot, AWS cloud, Java mug, EcoTrace earth and a debug cat">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .b { animation: b 2.6s ease-in-out infinite; }
    @keyframes b { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .sh { animation: sh 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sh { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.78); } }
    .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    .look { animation: look 5s ease-in-out infinite; }
    @keyframes look { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-3px); } 65% { transform: translateX(3px); } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .6; } }
    .tw { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 0%,100% { opacity: .1; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
    .steam { animation: steam 2.4s ease-in infinite; transform-box: fill-box; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .85; } 100% { opacity: 0; transform: translateY(-12px); } }
    .sway { animation: sway 2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes sway { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
    .wag { animation: wag 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 100%; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }
    .ear { animation: ear 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes ear { 0%,85%,100% { transform: rotate(0deg); } 90% { transform: rotate(-12deg); } 95% { transform: rotate(6deg); } }
    .bgtw { animation: bgtw 3s ease-in-out infinite; }
    @keyframes bgtw { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
  </style>

  <rect width="900" height="240" rx="22" fill="url(#tbg)"/>

  <g fill="#ffffff">
    <circle class="bgtw" cx="40" cy="30" r="1.6"/>
    <circle class="bgtw" style="animation-delay:.8s" cx="180" cy="22" r="1.4"/>
    <circle class="bgtw" style="animation-delay:1.6s" cx="360" cy="30" r="1.8"/>
    <circle class="bgtw" style="animation-delay:.4s" cx="540" cy="20" r="1.4"/>
    <circle class="bgtw" style="animation-delay:2.1s" cx="720" cy="32" r="1.6"/>
    <circle class="bgtw" style="animation-delay:1.2s" cx="868" cy="24" r="1.8"/>
    <circle class="bgtw" style="animation-delay:2.4s" cx="20" cy="200" r="1.4"/>
    <circle class="bgtw" style="animation-delay:.2s" cx="880" cy="205" r="1.4"/>
  </g>

  <!-- ground shadows -->
  <g fill="#000000" opacity=".3">
    <ellipse class="sh" cx="90" cy="160" rx="34" ry="6"/>
    <ellipse class="sh" cx="270" cy="160" rx="38" ry="6"/>
    <ellipse class="sh" cx="450" cy="160" rx="38" ry="6"/>
    <ellipse class="sh" cx="630" cy="160" rx="34" ry="6"/>
    <ellipse class="sh" cx="810" cy="160" rx="38" ry="6"/>
  </g>

  <!-- 1. AI robot -->
  <g transform="translate(90,100)">
    <g class="b">
      <line x1="0" y1="-34" x2="0" y2="-46" stroke="#94a3b8" stroke-width="3"/>
      <circle class="pulse" cx="0" cy="-50" r="6" fill="#fbbf24"/>
      <rect x="-40" y="-12" width="8" height="16" rx="3" fill="#3b82f6"/>
      <rect x="32" y="-12" width="8" height="16" rx="3" fill="#3b82f6"/>
      <rect x="-34" y="-34" width="68" height="54" rx="14" fill="#60a5fa"/>
      <rect x="-26" y="-27" width="52" height="38" rx="10" fill="#0f172a"/>
      <g class="look">
        <g class="blink">
          <ellipse cx="-12" cy="-12" rx="5" ry="6.5" fill="#67e8f9"/>
          <ellipse cx="12" cy="-12" rx="5" ry="6.5" fill="#67e8f9"/>
        </g>
      </g>
      <path d="M-8 1 Q0 8 8 1" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-22" y="24" width="44" height="26" rx="9" fill="#3b82f6"/>
      <path class="pulse" d="M0 44 C-8 38 -4 31 0 35 C4 31 8 38 0 44 Z" fill="#fbbf24"/>
    </g>
  </g>

  <!-- 2. AWS cloud -->
  <g transform="translate(270,100)">
    <g class="b" style="animation-delay:.4s">
      <g fill="#e0f2fe">
        <circle cx="-24" cy="8" r="20"/>
        <circle cx="2" cy="-8" r="28"/>
        <circle cx="28" cy="6" r="21"/>
        <rect x="-30" y="8" width="66" height="22" rx="11"/>
      </g>
      <g class="blink">
        <ellipse cx="-8" cy="6" rx="3.5" ry="5" fill="#1e3a8a"/>
        <ellipse cx="14" cy="6" rx="3.5" ry="5" fill="#1e3a8a"/>
      </g>
      <ellipse cx="-18" cy="16" rx="6" ry="3.5" fill="#fda4af" opacity=".8"/>
      <ellipse cx="24" cy="16" rx="6" ry="3.5" fill="#fda4af" opacity=".8"/>
      <path d="M-2 15 Q3 21 8 15" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(-50,-18)"><path class="tw" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2Z" fill="#fde68a"/></g>
      <g transform="translate(48,-26)"><path class="tw" style="animation-delay:.8s" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2Z" fill="#fde68a"/></g>
      <g transform="translate(52,22)"><path class="tw" style="animation-delay:1.5s" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5Z" fill="#fde68a"/></g>
    </g>
  </g>

  <!-- 3. Java mug -->
  <g transform="translate(450,100)">
    <g class="b" style="animation-delay:.8s">
      <path class="steam" d="M-14 -34 q-6 -9 0 -16 q6 -7 0 -15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:.8s" d="M2 -34 q-6 -9 0 -16 q6 -7 0 -15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:1.6s" d="M18 -34 q-6 -9 0 -16 q6 -7 0 -15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 -10 q20 0 20 16 q0 16 -20 16" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
      <rect x="-28" y="-24" width="50" height="56" rx="12" fill="#fb923c"/>
      <ellipse cx="-3" cy="-24" rx="25" ry="6" fill="#7c2d12"/>
      <g class="blink">
        <ellipse cx="-14" cy="4" rx="3.5" ry="5" fill="#431407"/>
        <ellipse cx="8" cy="4" rx="3.5" ry="5" fill="#431407"/>
      </g>
      <ellipse cx="-20" cy="14" rx="5" ry="3" fill="#fda4af"/>
      <ellipse cx="14" cy="14" rx="5" ry="3" fill="#fda4af"/>
      <path d="M-8 13 Q-3 19 2 13" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-3" cy="34" rx="40" ry="7" fill="#fed7aa"/>
    </g>
  </g>

  <!-- 4. EcoTrace earth -->
  <g transform="translate(630,100)">
    <g class="b" style="animation-delay:1.2s">
      <g class="sway"><path d="M0 -36 q-3 -12 9 -17 q3 11 -9 17 Z" fill="#22c55e"/><path d="M0 -36 q3 -10 -8 -15 q-4 10 8 15 Z" fill="#16a34a"/></g>
      <circle r="36" fill="#38bdf8"/>
      <path d="M-26 -14 Q-12 -32 4 -24 Q10 -12 -2 -6 Q-10 2 -24 4 Z" fill="#4ade80"/>
      <path d="M10 8 Q26 2 31 16 Q23 30 8 26 Q2 18 10 8 Z" fill="#4ade80"/>
      <ellipse cx="-16" cy="-20" rx="7" ry="3" fill="#ffffff" opacity=".35" transform="rotate(-30 -16 -20)"/>
      <g class="blink">
        <ellipse cx="-11" cy="2" rx="4" ry="5.5" fill="#0f172a"/>
        <ellipse cx="11" cy="2" rx="4" ry="5.5" fill="#0f172a"/>
      </g>
      <ellipse cx="-21" cy="12" rx="5.5" ry="3.2" fill="#fb7185" opacity=".7"/>
      <ellipse cx="21" cy="12" rx="5.5" ry="3.2" fill="#fb7185" opacity=".7"/>
      <path d="M-5 12 Q0 18 5 12" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 5. Debug cat -->
  <g transform="translate(810,100)">
    <g class="b" style="animation-delay:1.6s">
      <path class="wag" d="M26 46 q32 -2 26 -30" fill="none" stroke="#fdba74" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="0" cy="44" rx="28" ry="18" fill="#fdba74"/>
      <g class="ear"><path d="M-36 -16 L-32 -52 L-8 -30 Z" fill="#fdba74"/><path d="M-31 -26 L-29 -42 L-17 -31 Z" fill="#fda4af"/></g>
      <g class="ear" style="animation-delay:1.4s"><path d="M36 -16 L32 -52 L8 -30 Z" fill="#fdba74"/><path d="M31 -26 L29 -42 L17 -31 Z" fill="#fda4af"/></g>
      <ellipse cx="0" cy="0" rx="40" ry="34" fill="#fdba74"/>
      <path d="M0 -33 v10 M-10 -31 l2 8 M10 -31 l-2 8" stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none"/>
      <g class="blink">
        <ellipse cx="-16" cy="-2" rx="5" ry="7" fill="#1c1917"/>
        <ellipse cx="16" cy="-2" rx="5" ry="7" fill="#1c1917"/>
        <circle cx="-14" cy="-5" r="1.8" fill="#ffffff"/>
        <circle cx="18" cy="-5" r="1.8" fill="#ffffff"/>
      </g>
      <path d="M-4 8 L4 8 L0 13 Z" fill="#fb7185"/>
      <path d="M0 13 Q-5 19 -10 15 M0 13 Q5 19 10 15" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
      <path d="M-28 8 L-50 4 M-28 13 L-50 17 M28 8 L50 4 M28 13 L50 17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
    </g>
  </g>

  <!-- captions -->
  <g text-anchor="middle">
    <g fill="#ffffff" font-size="16" font-weight="700">
      <text x="90" y="192">AI Integrations</text>
      <text x="270" y="192">AWS Certified</text>
      <text x="450" y="192">Java &amp; DSA</text>
      <text x="630" y="192">EcoTrace</text>
      <text x="810" y="192">Debug Buddy</text>
    </g>
    <g fill="#c4b5fd" font-size="12">
      <text x="90" y="212">Groq • Gemini • LLMs</text>
      <text x="270" y="212">Cloud Practitioner</text>
      <text x="450" y="212">OOPs • DBMS • OS</text>
      <text x="630" y="212">Carbon accounting AI</text>
      <text x="810" y="212">Hunting bugs 24/7</text>
    </g>
  </g>
</svg>
