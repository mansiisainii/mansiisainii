<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mansi Saini - Software Engineer, Java and Full Stack MERN developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#4c1d95;#831843;#1e1b4b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#db2777;#4338ca;#7c3aed" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="300" rx="22"/></clipPath>
    <clipPath id="reveal">
      <rect x="30" y="100" width="0" height="90">
        <animate attributeName="width" from="0" to="520" dur="1.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .12; } 50% { opacity: 1; } }
    .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fl { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .typeL { animation: typeK .5s ease-in-out infinite alternate; }
    .typeR { animation: typeK .5s ease-in-out .25s infinite alternate; }
    @keyframes typeK { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .steam { animation: steam 2.4s ease-in infinite; transform-box: fill-box; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-14px); } }
    .heart { animation: heart 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes heart { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px) scale(1.1); } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .wave1 { animation: wv 9s linear infinite; }
    .wave2 { animation: wv 14s linear infinite reverse; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-300px); } }
    .flap { animation: flap .45s ease-in-out infinite alternate; transform-box: fill-box; }
    .wl { transform-origin: 100% 50%; }
    .wr { transform-origin: 0% 50%; }
    @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.2); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle class="tw" cx="60" cy="40" r="2"/>
      <circle class="tw" style="animation-delay:.7s" cx="190" cy="28" r="1.5"/>
      <circle class="tw" style="animation-delay:1.4s" cx="330" cy="48" r="2.2"/>
      <circle class="tw" style="animation-delay:2.1s" cx="420" cy="22" r="1.5"/>
      <circle class="tw" style="animation-delay:.3s" cx="560" cy="36" r="2"/>
      <circle class="tw" style="animation-delay:1.1s" cx="640" cy="70" r="1.6"/>
      <circle class="tw" style="animation-delay:1.8s" cx="870" cy="40" r="2"/>
      <circle class="tw" style="animation-delay:.5s" cx="860" cy="180" r="1.5"/>
      <circle class="tw" style="animation-delay:2.4s" cx="520" cy="200" r="1.8"/>
      <circle class="tw" style="animation-delay:1.6s" cx="30" cy="150" r="1.6"/>
      <circle class="tw" style="animation-delay:.9s" cx="610" cy="130" r="1.4"/>
      <circle class="tw" style="animation-delay:2.7s" cx="250" cy="265" r="1.5"/>
    </g>

    <!-- drifting waves -->
    <g class="wave1">
      <path fill="#ffffff" opacity=".08" d="M0 262 q75 -24 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V300 H0 Z"/>
    </g>
    <g class="wave2">
      <path fill="#ffffff" opacity=".12" d="M0 280 q75 18 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V300 H0 Z"/>
    </g>

    <!-- floating code symbols -->
    <g class="mono" fill="#ffffff" opacity=".35" font-size="28" font-weight="700">
      <text class="fl" x="500" y="52">&lt;/&gt;</text>
      <text class="fl" style="animation-delay:-2s;animation-duration:7s" x="560" y="112">{ }</text>
      <text class="fl" style="animation-delay:-4s;animation-duration:5s" x="505" y="190">=&gt;</text>
    </g>

    <!-- greeting + name -->
    <text x="42" y="92" font-size="24" fill="#e9d5ff">Hi there, I'm</text>
    <g clip-path="url(#reveal)">
      <text x="40" y="160" font-size="62" font-weight="800" fill="url(#nameGrad)">Mansi</text>
    </g>

    <!-- butterfly -->
    <g transform="translate(478,126)">
      <g class="fl" style="animation-duration:4s">
        <g class="flap wl"><ellipse cx="-9" cy="-4" rx="10" ry="12" fill="#f9a8d4"/><ellipse cx="-7" cy="9" rx="7" ry="8" fill="#c084fc"/></g>
        <g class="flap wr"><ellipse cx="9" cy="-4" rx="10" ry="12" fill="#f9a8d4"/><ellipse cx="7" cy="9" rx="7" ry="8" fill="#c084fc"/></g>
        <rect x="-1.5" y="-10" width="3" height="22" rx="1.5" fill="#ffffff"/>
        <path d="M0 -10 q-4 -7 -8 -8 M0 -10 q4 -7 8 -8" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- rotating role line -->
    <g class="mono" font-size="21" fill="#fbcfe8">
      <text x="42" y="210" fill="#f472b6">&gt;</text>
      <text x="68" y="210" opacity="0">Full Stack Developer (MERN)
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.25;1" dur="16s" begin="1.8s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="210" opacity="0">Java + DSA problem solver
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.25;1" dur="16s" begin="5.8s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="210" opacity="0">AI integrations builder
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.25;1" dur="16s" begin="9.8s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="210" opacity="0">AWS Certified Cloud Practitioner
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.25;1" dur="16s" begin="13.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- skill pills -->
    <g font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
      <g class="pulse"><rect x="42" y="232" width="74" height="28" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".35"/><text x="79" y="251">MERN</text></g>
      <g class="pulse" style="animation-delay:.4s"><rect x="126" y="232" width="66" height="28" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".35"/><text x="159" y="251">Java</text></g>
      <g class="pulse" style="animation-delay:.8s"><rect x="202" y="232" width="62" height="28" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".35"/><text x="233" y="251">AWS</text></g>
      <g class="pulse" style="animation-delay:1.2s"><rect x="274" y="232" width="50" height="28" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".35"/><text x="299" y="251">AI</text></g>
    </g>

    <!-- floating mini code window -->
    <g class="bob" style="animation-duration:4s">
      <rect x="806" y="64" width="80" height="62" rx="9" fill="#0f172a" fill-opacity=".88" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="816" cy="74" r="2.5" fill="#f87171"/>
      <circle cx="824" cy="74" r="2.5" fill="#fbbf24"/>
      <circle cx="832" cy="74" r="2.5" fill="#34d399"/>
      <rect x="814" y="88" width="8" height="5" rx="2.5" fill="#f472b6"><animate attributeName="width" values="6;52;52;6" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="814" y="99" width="8" height="5" rx="2.5" fill="#60a5fa"><animate attributeName="width" values="6;40;40;6" keyTimes="0;0.45;0.9;1" dur="4s" begin=".5s" repeatCount="indefinite"/></rect>
      <rect x="814" y="110" width="8" height="5" rx="2.5" fill="#34d399"><animate attributeName="width" values="6;58;58;6" keyTimes="0;0.5;0.9;1" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- cartoon coder -->
    <ellipse cx="715" cy="283" rx="72" ry="7" fill="#000000" opacity=".25"/>
    <g transform="translate(715,0)">
      <g class="bob">
        <!-- hoodie -->
        <path d="M-64 270 Q-64 196 -34 184 L34 184 Q64 196 64 270 Z" fill="#8b5cf6"/>
        <path d="M-28 184 Q0 204 28 184" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M-10 198 V220 M10 198 V220" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <!-- hair back + head -->
        <circle cx="0" cy="130" r="49" fill="#2b1d4a"/>
        <circle cx="0" cy="138" r="42" fill="#ffd9b8"/>
        <path d="M-43 132 Q-46 88 0 86 Q46 88 43 132 Q34 108 8 112 Q-6 100 -24 114 Q-38 112 -43 132 Z" fill="#2b1d4a"/>
        <!-- cat-ear headphones -->
        <path d="M-44 100 L-40 66 L-16 86 Z" fill="#ff5fa2"/>
        <path d="M44 100 L40 66 L16 86 Z" fill="#ff5fa2"/>
        <path d="M-38 92 L-37 76 L-26 86 Z" fill="#ffc1dc"/>
        <path d="M38 92 L37 76 L26 86 Z" fill="#ffc1dc"/>
        <path d="M-48 138 Q-50 82 0 82 Q50 82 48 138" fill="none" stroke="#ff5fa2" stroke-width="6" stroke-linecap="round"/>
        <rect x="-57" y="126" width="12" height="28" rx="6" fill="#ff5fa2"/>
        <rect x="45" y="126" width="12" height="28" rx="6" fill="#ff5fa2"/>
        <!-- face -->
        <g class="blink">
          <ellipse cx="-16" cy="140" rx="5" ry="7" fill="#2b1d4a"/>
          <ellipse cx="16" cy="140" rx="5" ry="7" fill="#2b1d4a"/>
          <circle cx="-14" cy="137" r="1.8" fill="#ffffff"/>
          <circle cx="18" cy="137" r="1.8" fill="#ffffff"/>
        </g>
        <ellipse cx="-28" cy="152" rx="7" ry="4" fill="#ff8fab" opacity=".55"/>
        <ellipse cx="28" cy="152" rx="7" ry="4" fill="#ff8fab" opacity=".55"/>
        <path d="M-6 154 Q0 162 6 154" fill="none" stroke="#b4546e" stroke-width="2.5" stroke-linecap="round"/>
        <!-- laptop -->
        <rect x="-62" y="208" width="124" height="58" rx="8" fill="#cbd5e1"/>
        <rect x="-58" y="212" width="116" height="50" rx="6" fill="#e2e8f0"/>
        <path class="pulse" d="M0 250 C-14 239 -8 229 0 236 C8 229 14 239 0 250 Z" fill="#f472b6"/>
        <rect x="-76" y="264" width="152" height="9" rx="4.5" fill="#94a3b8"/>
        <!-- hands typing -->
        <rect x="-44" y="196" width="24" height="12" rx="6" fill="#7c3aed"/>
        <rect x="20" y="196" width="24" height="12" rx="6" fill="#7c3aed"/>
        <circle class="typeL" cx="-32" cy="204" r="9" fill="#ffd9b8"/>
        <circle class="typeR" cx="32" cy="204" r="9" fill="#ffd9b8"/>
        <!-- coffee mug -->
        <rect x="-114" y="238" width="24" height="26" rx="5" fill="#ffffff"/>
        <path d="M-90 244 q10 0 10 8 q0 8 -10 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="-102" cy="238" rx="12" ry="3" fill="#92400e"/>
        <path class="steam" d="M-106 232 q-4 -8 0 -14 q4 -6 0 -12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="steam" style="animation-delay:.9s" d="M-98 232 q-4 -8 0 -14 q4 -6 0 -12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- floating hearts -->
        <g transform="translate(64,98) scale(1.3)"><path class="heart" d="M0 0 C-7 -8 -2 -14 0 -9 C2 -14 7 -8 0 0 Z" fill="#fb7185"/></g>
        <g transform="translate(-70,108) scale(1.1)"><path class="heart" style="animation-delay:1.8s" d="M0 0 C-7 -8 -2 -14 0 -9 C2 -14 7 -8 0 0 Z" fill="#f9a8d4"/></g>
      </g>
    </g>
  </g>
</svg>
